<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Masa Kartı</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<style>
  body{background:#e9e1d4}
  .wrap{max-width:900px;margin:0 auto;padding:24px}
  .toolbar{display:flex;gap:10px;justify-content:center;margin-bottom:20px;flex-wrap:wrap;align-items:center}
  .sheet{display:grid;grid-template-columns:repeat(var(--cols,1),1fr);gap:16px;justify-items:center}
  .tc{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:28px 24px;text-align:center;border:1px solid var(--line)}
  .tc .t1{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .tc .t2{font-size:38px;line-height:1.05;margin:10px 0 4px}
  .tc .t3{font-size:14px;color:var(--muted);margin-bottom:16px}
  .tc .qr svg{width:170px;height:170px}
  .tc .t4{font-weight:700;margin-top:12px;font-size:16px}
  .tc .t5{font-size:12px;color:var(--muted);margin-top:4px}
  .tc .brand{margin-top:18px;padding-top:12px;border-top:1px dashed var(--line);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
  .tc .brand img{height:18px}
  @media print{
    body{background:#fff}.toolbar,.setup-warning{display:none!important}
    .wrap{padding:0;max-width:none}.sheet{gap:0}
    .tc{border:1px dashed #ccc;border-radius:0;break-inside:avoid;max-width:none;padding:14mm 10mm}
    @page{size:A4;margin:10mm}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <label class="small">Sayfa başına
      <select class="input" id="cols" style="width:auto;display:inline-block;padding:8px 34px 8px 10px;font-size:14px">
        <option value="1">1 kart</option><option value="2" selected>2 kart</option><option value="4">4 kart</option>
      </select></label>
    <button class="btn primary sm" onclick="window.print()">🖨️ Yazdır / PDF kaydet</button>
  </div>
  <div class="sheet" id="sheet"><div class="spinner"></div></div>
</div>
<script>
(async function () {
  const { $, esc } = App; const slug = App.qs("s");
  if (!slug) { $("#sheet").textContent = "Bağlantı eksik."; return; }
  let ev; try { ev = await App.rpc("ak_event_public", { p_slug: slug }); } catch (e) { $("#sheet").textContent = e.message; return; }
  App.applyBrand(ev.brand);
  const link = App.guestLink(slug);
  const short = link.replace(/^https?:\/\//, "");
  const card = `<div class="tc">
    <div class="t1">Bu gece bizim fotoğrafçımız siz olun</div>
    <div class="t2 serif">${esc(App.couple(ev))}</div>
    <div class="t3">${esc(ev.event_type)} · ${esc(App.fmtDate(ev.event_date))}</div>
    <div class="qr">${App.qrSvg(link)}</div>
    <div class="t4">Telefon kameranızla kodu okutun</div>
    <div class="t5">Uygulama indirmenize gerek yok${ev.photo_limit ? " · kişi başı " + ev.photo_limit + " poz" : ""}</div>
    <div class="brand">${ev.brand.logo_url ? `<img src="${esc(ev.brand.logo_url)}" alt="">` : ""}${esc(ev.brand.name)} · ${esc(ev.brand.tagline || "Anı Kamerası")}</div>
  </div>`;
  function render() { const n = +$("#cols").value; $("#sheet").style.setProperty("--cols", n >= 2 ? 2 : 1); $("#sheet").innerHTML = card.repeat(n); }
  $("#cols").onchange = render; render();
})();
</script>
</body>
</html>
