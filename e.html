<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Anı Kamerası</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brandmark"><span data-brand-logo><span class="dot"></span></span><span data-brand-name></span></div>
    <span class="small muted" data-brand-tagline></span>
  </div>
  <main>
    <div class="spinner" id="loading"></div>
    <div class="card center hidden" id="fatal"></div>

    <section id="welcome" class="hidden">
      <div class="hero">
        <div class="eyebrow">Bu gecenin fotoğrafçısı sizsiniz</div>
        <h1 class="serif" id="couple"></h1>
        <div class="meta" id="meta"></div>
      </div>
      <form class="card" id="nameForm">
        <div class="small muted" style="line-height:1.5">Uygulama indirmenize gerek yok. Çektiğiniz kareler çiftin ortak albümünde toplanır.</div>
        <label class="field" for="gname">Adınız</label>
        <input class="input" id="gname" placeholder="Örn. Zeynep" autocomplete="given-name" maxlength="30" required>
        <label class="check"><input type="checkbox" id="kvkk" required> <span>Çektiğim fotoğrafların etkinlik sahibine iletilmesini ve <a href="kvkk.html" target="_blank">aydınlatma metninde</a> belirtilen süre boyunca saklanmasını kabul ediyorum.</span></label>
        <button class="btn primary" type="submit">Kameraya geç →</button>
      </form>
    </section>

    <section id="camera" class="hidden">
      <div class="cam">
        <div class="cam-top">
          <span>Merhaba, <b id="hello"></b> · <a href="#" id="rename" style="color:#cfc6bc">değiştir</a></span>
          <span class="counter" id="counter"></span>
        </div>
        <div class="finder">
          <div class="hint" id="hint">Deklanşöre bastığınızda telefonunuzun kamerası açılır.<br><br>Çektiğiniz kare burada görünür.</div>
          <img id="last" alt="" class="hidden">
          <i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i>
          <div class="flash" id="flash"></div>
          <div class="uploading hidden" id="uploading"></div>
        </div>
        <div class="cam-controls">
          <div class="toggle" id="filmToggle"><div class="switch on" id="filmSwitch"></div><span>Film<br>efekti</span></div>
          <label class="shutter" id="shutter" for="camInput" aria-label="Fotoğraf çek"><span></span></label>
          <label class="side-btn" id="galBtn" for="galInput">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
            Galeriden
          </label>
        </div>
        <input class="hidden-input" type="file" id="camInput" accept="image/*" capture="environment">
        <input class="hidden-input" type="file" id="galInput" accept="image/*" multiple>
        <div class="mine" id="mine"></div>
      </div>
      <div class="note" id="revealNote"></div>
    </section>
  </main>
</div>
<script>
(async function () {
  const { $, rpc, esc } = App;
  const slug = App.qs("s");
  let ev = null, remaining = null, film = true, busy = false;

  function fatal(msg) { $("#loading").classList.add("hidden"); $("#fatal").innerHTML = msg; $("#fatal").classList.remove("hidden"); }
  if (!slug) return fatal("Bağlantı eksik. Lütfen masanızdaki QR kodu yeniden okutun.");

  // Cihaza özel misafir anahtarı
  let token = App.storage.get("guestToken");
  if (!token || token.length < 16) {
    const a = new Uint8Array(16); crypto.getRandomValues(a);
    token = [...a].map((x) => x.toString(16).padStart(2, "0")).join("");
    App.storage.set("guestToken", token);
  }
  let name = App.storage.get("guestName:" + slug);

  try { ev = await rpc("ak_event_public", { p_slug: slug }); }
  catch (e) { return fatal(esc(e.message)); }
  App.applyBrand(ev.brand);
  $("#loading").classList.add("hidden");
  $("#couple").innerHTML = ev.name_b ? `${esc(ev.name_a)} <i>&amp;</i> ${esc(ev.name_b)}` : esc(ev.name_a);
  $("#meta").textContent = ev.event_type + " · " + App.fmtDate(ev.event_date) + (ev.venue ? " · " + ev.venue : "");
  if (!ev.accepting) {
    return fatal(`<div class="serif" style="font-size:28px">${esc(App.couple(ev))}</div><p class="muted" style="margin-top:8px">Bu etkinlik artık fotoğraf kabul etmiyor. Katıldığınız için teşekkürler!</p>`);
  }
  $("#revealNote").textContent = ev.revealed
    ? "Çektiğiniz kareler anında çiftin albümüne düşer."
    : "Tek kullanımlık makine gibi: kareleriniz " + App.fmtDateTime(ev.reveal_at) + "'da albümde açılır.";

  function show(view) { $("#welcome").classList.toggle("hidden", view !== "welcome"); $("#camera").classList.toggle("hidden", view !== "camera"); }
  if (name) startCamera(); else show("welcome");

  $("#nameForm").onsubmit = (e) => {
    e.preventDefault(); name = $("#gname").value.trim(); if (!name) return;
    App.storage.set("guestName:" + slug, name); startCamera();
  };
  $("#rename").onclick = (e) => { e.preventDefault(); $("#gname").value = name || ""; show("welcome"); };
  $("#filmToggle").onclick = () => { film = !film; $("#filmSwitch").classList.toggle("on", film); App.toast(film ? "Film efekti açık" : "Film efekti kapalı"); };

  async function startCamera() {
    $("#hello").textContent = name; show("camera");
    try {
      const st = await rpc("ak_guest_status", { p_slug: slug, p_token: token });
      remaining = st.remaining;
      $("#mine").innerHTML = st.shots.map((p) => `<img src="${App.photoUrl(p)}" alt="" loading="lazy">`).join("");
    } catch (e) { App.toast(e.message); }
    renderCounter();
  }
  function renderCounter() {
    $("#counter").innerHTML = remaining === null ? "Sınırsız poz" : `<b>${remaining}</b> poz kaldı`;
    const off = remaining !== null && remaining <= 0;
    $("#shutter").classList.toggle("off", off || busy); $("#galBtn").classList.toggle("off", off || busy);
  }

  async function upload(file) {
    const blob = await App.processImage(file, { film, stamp: App.stamp(ev.event_date) });
    const r = await rpc("ak_reserve_photo", { p_slug: slug, p_token: token, p_guest_name: name });
    const { error } = await App.sb.storage.from("ak-photos").upload(r.path, blob, { contentType: "image/jpeg", upsert: false, cacheControl: "31536000" });
    if (error) throw new Error("Yükleme başarısız: " + error.message);
    await rpc("ak_confirm_photo", { p_photo_id: r.photo_id, p_token: token });
    remaining = r.remaining;
    const url = URL.createObjectURL(blob);
    $("#last").src = url; $("#last").classList.remove("hidden"); $("#hint").classList.add("hidden");
    $("#mine").insertAdjacentHTML("afterbegin", `<img src="${url}" alt="">`);
    const fl = $("#flash"); fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go");
  }

  async function handle(files) {
    if (!files.length || busy) return;
    busy = true; renderCounter(); let ok = 0;
    for (let i = 0; i < files.length; i++) {
      if (remaining !== null && remaining <= 0) { App.toast("Pozlarınız bitti 🎞️"); break; }
      $("#uploading").textContent = files.length > 1 ? `Yükleniyor ${i + 1}/${files.length}…` : "Yükleniyor…";
      $("#uploading").classList.remove("hidden");
      try { await upload(files[i]); ok++; }
      catch (e) { App.toast(e.message); break; }
    }
    $("#uploading").classList.add("hidden"); busy = false; renderCounter();
    if (ok) App.toast(ev.revealed ? "Albüme eklendi ✨" : "Çekildi! Albümde açılacak 🎞️");
  }
  $("#camInput").onchange = (e) => { handle([...e.target.files]); e.target.value = ""; };
  $("#galInput").onchange = (e) => { handle([...e.target.files]); e.target.value = ""; };
})();
</script>
</body>
</html>
